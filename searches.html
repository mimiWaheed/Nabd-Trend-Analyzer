<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NABD (نبض) - saved searches: rename, duplicate, run again, favorite and organize into folders.">
  <title>Saved Searches - NABD (نبض)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%235EA2FF'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23070B14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nabd-theme') || 'dark';
        if (t === 'system') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        var l = localStorage.getItem('nabd-lang') || 'en';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page" data-page="searches">

  <div id="appShell"></div>

  <main class="app-main">
    <div class="app-head">
      <div>
        <h1 data-i18n="app.title.searches">Saved Searches</h1>
        <p data-i18n="app.sub.searches">Your saved queries, organized in folders.</p>
      </div>
      <div class="app-head-actions">
        <button class="btn btn-primary btn-sm" id="searchNewFolder" data-i18n="srch.new">New folder</button>
      </div>
    </div>

    <div class="app-toolbar">
      <div class="toolbar-group" id="searchFolders"></div>
    </div>

    <div id="searchRows"></div>

    <div class="empty-state" id="searchEmpty" style="display:none">
      <div class="e-ic">⌕</div>
      <p data-i18n="srch.empty">No saved searches match this folder.</p>
    </div>
  </main>

  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
