<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your NABD (نبض) account — Egypt's AI intelligence platform.">
  <title>Sign Up — NABD (نبض)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%235EA2FF'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23070B14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nabd-theme') || 'dark';
        if (t === 'system') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        var l = localStorage.getItem('nabd-lang') || 'en';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-enter auth-page">

  <div class="auth-bg" aria-hidden="true">
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="aurora aurora-c"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- ============================================================ -->
  <!--  NAVIGATION (compact)                                        -->
  <!-- ============================================================ -->
  <header class="nav" id="nav">
    <div class="container">
      <div class="nav-inner">
        <a class="brand" href="index.html" data-page="index.html" aria-label="NABD home">
          <span class="brand-orb"><span class="brand-orb-core"></span></span>
          <span class="brand-name" data-i18n="brand">NABD</span>
        </a>
        <div class="nav-actions">
          <button class="icon-btn" data-action="theme" aria-label="Toggle theme">
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>
          <button class="lang-toggle mono" data-action="lang">العربية</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ============================================================ -->
  <!--  SIGN UP                                                      -->
  <!-- ============================================================ -->
  <div class="auth-panel">
    <div class="auth-card glass">
      <a class="auth-logo" href="index.html" data-page="index.html" aria-label="NABD home">
        <span class="brand-orb"><span class="brand-orb-core"></span></span>
        <span class="brand-name" data-i18n="brand">NABD</span>
      </a>
      <h1 class="auth-title" data-i18n="auth.signup.title">Create your account</h1>
      <p class="auth-sub" data-i18n="auth.signup.sub">Start watching Egypt's pulse in minutes.</p>

      <form id="signupForm" novalidate>
        <div class="field-row" style="margin:0 0 18px;">
          <div class="field" style="flex:1;margin:0;">
            <label for="suFirst" data-i18n="auth.first">First name</label>
            <input type="text" id="suFirst" name="first" autocomplete="given-name" spellcheck="false">
          </div>
          <div class="field" style="flex:1;margin:0;">
            <label for="suLast" data-i18n="auth.last">Last name</label>
            <input type="text" id="suLast" name="last" autocomplete="family-name" spellcheck="false">
          </div>
        </div>
        <div class="field">
          <label for="suOrg" data-i18n="auth.org">Organization</label>
          <input type="text" id="suOrg" name="organization" autocomplete="organization" spellcheck="false">
        </div>
        <div class="field">
          <label for="suEmail" data-i18n="auth.email">Email address</label>
          <input type="email" id="suEmail" name="email" autocomplete="email" spellcheck="false">
        </div>
        <div class="field">
          <label for="suPwd" data-i18n="auth.pass">Password</label>
          <div class="pwd-wrap">
            <input type="password" id="suPwd" name="password" autocomplete="new-password">
            <button type="button" class="pwd-toggle" data-pwd-toggle="suPwd" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="suPwd2" data-i18n="auth.confirm">Confirm password</label>
          <div class="pwd-wrap">
            <input type="password" id="suPwd2" name="password2" autocomplete="new-password">
            <button type="button" class="pwd-toggle" data-pwd-toggle="suPwd2" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field-row" style="margin:0 0 18px;">
          <div class="field" style="flex:1;margin:0;">
            <label for="suCountry" data-i18n="auth.country">Country</label>
            <select id="suCountry" name="country"></select>
          </div>
          <div class="field" style="flex:1;margin:0;">
            <label for="suLang" data-i18n="auth.lang">Language</label>
            <select id="suLang" name="lang"></select>
          </div>
        </div>
        <div class="field auth-terms">
          <label class="check">
            <input type="checkbox" id="suTerms">
            <span data-i18n="auth.terms">I agree to the Terms & Privacy Policy</span>
          </label>
        </div>
        <p class="auth-error" id="authError"></p>
        <button type="submit" class="btn btn-primary auth-submit" id="signupSubmit" data-i18n="auth.signup.submit">Create account</button>
      </form>

      <p class="auth-alt" data-i18n="auth.alt">or continue with</p>
      <div class="social-row">
        <button type="button" class="btn btn-google" data-social="google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.57 5.57 0 0 1-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82Z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09A11.99 11.99 0 0 0 12 24Z"/><path fill="#FBBC05" d="M5.27 14.29a7.17 7.17 0 0 1 0-4.58V6.62H1.29a12 12 0 0 0 0 10.76l3.98-3.09Z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A11.99 11.99 0 0 0 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75Z"/></svg>
          <span data-i18n="auth.google">Google</span>
        </button>
        <button type="button" class="btn btn-fb" data-social="facebook">
          <svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07Z"/></svg>
          <span data-i18n="auth.facebook">Facebook</span>
        </button>
      </div>

      <p class="auth-switch" data-i18n-html="auth.signin.switch">Already have an account? <a class="link-soft" href="signin.html" data-page="signin.html">Sign in</a></p>
      <p class="auth-switch"><a class="link-soft" href="index.html" data-page="index.html" data-i18n="auth.back">Back to home</a></p>
    </div>
  </div>

  <!-- ============================================================ -->
  <!--  ART SIDE                                                     -->
  <!-- ============================================================ -->

      <div class="art-ring r1"></div>
      <div class="art-ring r2"></div>

      </svg>
    </div>
  </div>

  <div class="toast" id="authToast" role="status"></div>

  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
