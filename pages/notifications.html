<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NABD (نبض) - notification center: AI alerts, trend spikes, system updates, reports and exports.">
  <title>Notifications - NABD (نبض)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%235EA2FF'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23070B14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nabd-theme') || 'dark';
        if (t === 'system') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        var l = localStorage.getItem('nabd-lang') || 'en';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-page" data-page="notifications">

  <div id="appShell"></div>

  <main class="app-main">
    <div class="app-head">
      <div>
        <h1 data-i18n="app.title.notifications">Notifications</h1>
        <p data-i18n="app.sub.notifications">Alerts and updates across the platform.</p>
      </div>
      <div class="app-head-actions">
        <span class="status-chip neu"><span class="d"></span><span id="notifUnread">0</span>&nbsp;<span data-i18n="notif.unread">unread</span></span>
        <button class="btn btn-ghost btn-sm" id="notifMark" data-i18n="notif.mark">Mark all read</button>
      </div>
    </div>

    <div class="app-toolbar">
      <div class="toolbar-group">
        <button class="filter-chip active" data-nf="all" data-i18n="notif.f.all">All</button>
        <button class="filter-chip" data-nf="ai" data-i18n="notif.f.ai">AI alerts</button>
        <button class="filter-chip" data-nf="trend" data-i18n="notif.f.trend">Trend spikes</button>
        <button class="filter-chip" data-nf="system" data-i18n="notif.f.system">System</button>
        <button class="filter-chip" data-nf="reports" data-i18n="notif.f.reports">Reports</button>
        <button class="filter-chip" data-nf="conn" data-i18n="notif.f.conn">Connections</button>
        <button class="filter-chip" data-nf="export" data-i18n="notif.f.export">Exports</button>
      </div>
    </div>

    <div id="notifList"></div>
    <div class="empty-state notif-empty" id="notifEmpty" hidden>
      <div class="e-ic">✉</div>
      <p data-i18n="notif.empty.new">No notifications yet — completed analyses and account events will appear here.</p>
    </div>
  </main>

  <script src="../js/script.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
