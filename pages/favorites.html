<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NABD (نبض) - favorites: bookmarked reports, searches, dashboards and topics.">
  <title>Favorites - NABD (نبض)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%235EA2FF'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23070B14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nabd-theme') || 'dark';
        if (t === 'system') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        var l = localStorage.getItem('nabd-lang') || 'en';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-page" data-page="favorites">

  <div id="appShell"></div>

  <main class="app-main">
    <div class="app-head">
      <div>
        <h1 data-i18n="app.title.favorites">Favorites</h1>
        <p data-i18n="app.sub.favorites">Everything you bookmarked in one place.</p>
      </div>
    </div>

    <div class="app-toolbar fav-tabs">
      <div class="seg">
        <button class="seg-btn active" data-ft="reports" data-i18n="fav.t.reports">Reports</button>
        <button class="seg-btn" data-ft="searches" data-i18n="fav.t.searches">Searches</button>
        <button class="seg-btn" data-ft="dashboards" data-i18n="fav.t.dashboards">Dashboards</button>
        <button class="seg-btn" data-ft="topics" data-i18n="fav.t.topics">Topics</button>
      </div>
    </div>

    <div class="fav-sec on" data-fs="reports">
      <div class="doc-grid" id="favReports"></div>
      <div class="fav-empty" id="favReportsEmpty" hidden>
        <span class="prof-empty-ic"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8-5.4 2.8 1-6L3.3 9.4l6-.9z"/></svg></span>
        <p data-i18n="fav.empty.reports">No favorite reports yet.</p>
      </div>
    </div>

    <div class="fav-sec" data-fs="searches">
      <div id="favSearches"></div>
      <div class="fav-empty" id="favSearchesEmpty" hidden>
        <span class="prof-empty-ic"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg></span>
        <p data-i18n="fav.empty.searches">No favorite searches yet.</p>
      </div>
    </div>

    <div class="fav-sec" data-fs="dashboards">
      <div class="fav-empty">
        <span class="prof-empty-ic"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg></span>
        <p data-i18n="fav.empty.dashboards">Saved dashboards will appear here.</p>
      </div>
    </div>

    <div class="fav-sec" data-fs="topics">
      <div class="fav-empty">
        <span class="prof-empty-ic"><svg viewBox="0 0 24 24"><path d="M7 7h10M7 12h10M7 17h6"/></svg></span>
        <p data-i18n="fav.empty.topics">Followed topics will appear here.</p>
      </div>
    </div>
  </main>

  <script src="../js/script.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
