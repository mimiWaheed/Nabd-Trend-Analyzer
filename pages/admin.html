<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NABD (نبض) - Admin panel: manage users, roles and platform statistics.">
  <title>Admin - NABD (نبض)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%235EA2FF'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23070B14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nabd-theme') || 'dark';
        if (t === 'system') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        var l = localStorage.getItem('nabd-lang') || 'en';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-page" data-page="admin">

  <div id="appShell"></div>

  <main class="app-main">
    <div class="app-head">
      <div>
        <h1 data-i18n="admin.title">Admin Panel</h1>
        <p data-i18n="admin.sub">Manage users, roles and platform health.</p>
      </div>
    </div>

    <!-- Stats Overview -->
    <div class="stats-grid" id="adminStats" style="margin-bottom:22px">
      <div class="stat">
        <div class="stat-val" id="adminStatUsers">—</div>
        <div class="stat-label" data-i18n="admin.stat.users">Total Users</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="adminStatReports">—</div>
        <div class="stat-label" data-i18n="admin.stat.reports">Total Reports</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="adminStatExports">—</div>
        <div class="stat-label" data-i18n="admin.stat.exports">Total Exports</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="adminStatRPM">—</div>
        <div class="stat-label" data-i18n="admin.stat.rpm">Est. Reports/Min</div>
      </div>
    </div>

    <!-- User Management -->
    <div class="ws-card" style="margin-bottom:22px">
      <div class="card-head">
        <div>
          <h3 class="card-title" data-i18n="admin.users.t">User Management</h3>
          <p class="card-sub" data-i18n="admin.users.s">ALL REGISTERED USERS</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" class="inp" id="adminSearch" placeholder="Search by name or email..." style="max-width:260px;font-size:.82rem">
        </div>
      </div>
      <div style="overflow-x:auto">
        <table class="admin-table" id="adminUserTable">
          <thead>
            <tr>
              <th data-i18n="admin.th.name">Name</th>
              <th data-i18n="admin.th.email">Email</th>
              <th data-i18n="admin.th.role">Role</th>
              <th data-i18n="admin.th.joined">Joined</th>
              <th data-i18n="admin.th.actions">Actions</th>
            </tr>
          </thead>
          <tbody id="adminUserBody"></tbody>
        </table>
      </div>
      <div class="admin-pager" id="adminPager" style="display:flex;justify-content:space-between;align-items:center;padding:12px 0">
        <span class="mono" style="font-size:.78rem;color:var(--muted)" id="adminCount"></span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" id="adminPrev" disabled data-i18n="admin.prev">Previous</button>
          <button class="btn btn-ghost btn-sm" id="adminNext" data-i18n="admin.next">Next</button>
        </div>
      </div>
    </div>

    <!-- User Detail Modal -->
    <div class="modal-overlay" id="adminModal" hidden>
      <div class="modal-card ws-card" style="max-width:480px;width:100%">
        <div class="card-head">
          <h3 class="card-title" data-i18n="admin.modal.profile">User Profile</h3>
          <button class="btn btn-ghost btn-sm" id="adminModalClose">&times;</button>
        </div>
        <div id="adminModalBody">
          <div class="admin-profile-grid">
            <div><span class="admin-pf-label" data-i18n="admin.pf.name">Name</span><span class="admin-pf-val" id="admName"></span></div>
            <div><span class="admin-pf-label" data-i18n="admin.pf.email">Email</span><span class="admin-pf-val" id="admEmail"></span></div>
            <div><span class="admin-pf-label" data-i18n="admin.pf.role">Role</span><span class="admin-pf-val" id="admRole"></span></div>
            <div><span class="admin-pf-label" data-i18n="admin.pf.joined">Joined</span><span class="admin-pf-val" id="admJoined"></span></div>
            <div><span class="admin-pf-label" data-i18n="admin.pf.analyses">Analyses</span><span class="admin-pf-val" id="admAnalyses"></span></div>
            <div><span class="admin-pf-label" data-i18n="admin.pf.searches">Searches</span><span class="admin-pf-val" id="admSearches"></span></div>
            <div><span class="admin-pf-label" data-i18n="admin.pf.downloads">Downloads</span><span class="admin-pf-val" id="admDownloads"></span></div>
          </div>
          <div style="display:flex;gap:8px;margin-top:16px" id="admActions">
            <select class="inp" id="admRoleSelect" style="max-width:180px;font-size:.82rem">
              <option value="analyst">Analyst</option>
              <option value="nabd_admin">NABD Admin</option>
            </select>
            <button class="btn btn-primary btn-sm" id="admRoleBtn" data-i18n="admin.action.role">Change Role</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger,#F45D5D)" id="admDeleteBtn" data-i18n="admin.action.delete">Delete User</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <style>
    .admin-table { width:100%; border-collapse:collapse; font-size:.85rem; }
    .admin-table th { text-align:left; padding:10px 12px; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border-bottom:1px solid var(--border); font-weight:600; }
    .admin-table td { padding:10px 12px; border-bottom:1px solid var(--border); }
    .admin-table tr:hover td { background:var(--hover); }
    .admin-pf-label { display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:2px; }
    .admin-pf-val { font-size:.9rem; font-weight:500; }
    .admin-profile-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 20px; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:1000; padding:20px; }
    .modal-overlay[hidden] { display:none; }
    .modal-card { max-height:80vh; overflow-y:auto; }
    .role-chip { display:inline-block; padding:2px 8px; border-radius:6px; font-size:.72rem; font-weight:600; text-transform:uppercase; }
    .role-chip.analyst { background:rgba(94,162,255,.15); color:#5EA2FF; }
    .role-chip.nabd_admin { background:rgba(255,165,60,.15); color:#FFA53C; }
    .role-chip.superadmin { background:rgba(53,208,127,.15); color:#35D07F; }
  </style>

  <script src="../js/script.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
