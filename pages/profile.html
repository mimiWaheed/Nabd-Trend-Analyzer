<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NABD (نبض) - user profile: identity and usage statistics.">
  <title>Profile - NABD (نبض)</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%235EA2FF'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23070B14'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('nabd-theme') || 'dark';
        if (t === 'system') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        var l = localStorage.getItem('nabd-lang') || 'en';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="app-page" data-page="profile">

  <div id="appShell"></div>

  <main class="app-main">
    <div class="app-head">
      <div>
        <h1 data-i18n="app.title.profile">Profile</h1>
        <p data-i18n="app.sub.profile">Your identity and usage at a glance.</p>
      </div>
    </div>

    <div class="dash-grid">

      <!-- About -->
      <div class="ws-card sp-8">
        <div class="card-head">
          <span class="card-title" data-i18n="prof.about">About</span>
          <button class="btn btn-primary btn-sm" id="profEdit" data-i18n="prof.edit">Edit profile</button>
        </div>
        <div class="prof-about-body">
          <div class="prof-hero">
            <div class="prof-avatar-wrap">
              <span class="avatar" id="profAvatar" style="width:64px;height:64px;border-radius:20px;font-size:1.3rem"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
              <button type="button" class="icon-btn sm prof-photo-btn" id="profPhotoBtn" data-i18n-title="prof.photo.add" title="Add photo">
                <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
              </button>
              <input type="file" id="profPhotoInput" accept="image/*" hidden>
            </div>
            <div>
              <div class="prof-hero-name" id="profName">—</div>
              <span class="status-chip ok" id="profVerified"><span class="d"></span></span>
            </div>
          </div>
          <div class="kv prof-kv">
            <span class="k" data-i18n="prof.role">Role</span><span class="v" id="profRole">—</span>
            <span class="k" data-i18n="prof.org">Organization</span><span class="v" id="profOrg">—</span>
            <span class="k" data-i18n="prof.city">City</span><span class="v" id="profCity">—</span>
            <span class="k" data-i18n="prof.lang">Language</span><span class="v" id="profLang">—</span>
            <span class="k" data-i18n="prof.email">Email</span><span class="v" id="profEmail">—</span>
            <span class="k" data-i18n="prof.phone">Phone</span><span class="v" id="profPhone">—</span>
            <span class="k" data-i18n="prof.joined">Joined</span><span class="v" id="profJoined">—</span>
          </div>
        </div>
      </div>

      <!-- Stats + activity -->
      <div class="sp-4 prof-side">
        <div class="prof-stats">
          <div class="prof-stat">
            <span class="prof-stat-ic"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zM14 2v6h6M9 13h7M9 17h5"/></svg></span>
            <span class="prof-stat-label" data-i18n="prof.u3">Exports</span>
            <span class="prof-stat-value" id="profUseE">—</span>
          </div>
          <div class="prof-stat">
            <span class="prof-stat-ic"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg></span>
            <span class="prof-stat-label" data-i18n="prof.u4">Searches</span>
            <span class="prof-stat-value" id="profUseS">—</span>
          </div>
        </div>

        <div class="ws-card prof-activity">
          <div class="card-head"><span class="card-title" data-i18n="prof.activity">Recent activity</span></div>
          <div class="prof-activity-body">
            <div class="prof-empty" id="profTimelineEmpty" hidden>
              <span class="prof-empty-ic"><svg viewBox="0 0 24 24"><path d="M12 8v4l3 3M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg></span>
              <p data-i18n="prof.activity.empty">No recent activity yet.</p>
            </div>
            <div class="timeline" id="profTimeline"></div>
          </div>
        </div>
      </div>

      <!-- Looking for something? -->
      <div class="ws-card sp-12">
        <div class="card-head"><span class="card-title" data-i18n="prof.nav.title">Looking for something?</span></div>
        <div class="prof-nav-body" id="profNav"></div>
      </div>
    </div>
  </main>

  <!-- Edit profile modal -->
  <div class="c-modal" id="profModal" hidden>
    <div class="c-modal-mask" id="profModalMask"></div>
    <div class="c-modal-card prof-modal" role="dialog" aria-modal="true" aria-labelledby="profModalName">
      <div class="prof-modal-head">
        <span class="avatar" id="profModalAvatar"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
        <div class="grow">
          <div class="prof-modal-name" id="profModalName">—</div>
          <div class="prof-modal-mail" id="profModalEmail">—</div>
        </div>
        <button type="button" class="icon-btn sm" id="profModalClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <form id="profForm" class="prof-modal-body">
        <div class="field-row prof-field-row">
          <div class="field">
            <label data-i18n="auth.first">First name</label>
            <input type="text" id="profEditFirst" autocomplete="given-name" maxlength="80">
          </div>
          <div class="field">
            <label data-i18n="auth.last">Last name</label>
            <input type="text" id="profEditLast" autocomplete="family-name" maxlength="80">
          </div>
        </div>
        <div class="field-row prof-field-row">
          <div class="field">
            <label data-i18n="prof.role">Role</label>
            <input type="text" id="profEditRole" maxlength="80" placeholder="e.g. Data Engineer">
          </div>
          <div class="field">
            <label data-i18n="auth.phone">Phone number</label>
            <input type="tel" id="profEditPhone" autocomplete="tel" maxlength="30">
          </div>
        </div>
        <div class="field-row prof-field-row">
          <div class="field">
            <label data-i18n="prof.org">Organization</label>
            <input type="text" id="profEditOrg" maxlength="120">
          </div>
          <div class="field">
            <label data-i18n="prof.city">City</label>
            <select id="profEditCity">
              <option value="">—</option>
              <option value="Cairo">Cairo</option>
              <option value="Alexandria">Alexandria</option>
              <option value="Giza">Giza</option>
              <option value="Tanta">Tanta</option>
              <option value="Mansoura">Mansoura</option>
              <option value="Zagazig">Zagazig</option>
              <option value="Ismailia">Ismailia</option>
              <option value="Port Said">Port Said</option>
              <option value="Suez">Suez</option>
              <option value="Damietta">Damietta</option>
              <option value="Damanhur">Damanhur</option>
              <option value="Kafr El Sheikh">Kafr El Sheikh</option>
              <option value="Mahalla El Kubra">Mahalla El Kubra</option>
              <option value="Shebin El Kom">Shebin El Kom</option>
              <option value="Sadat City">Sadat City</option>
              <option value="Minya">Minya</option>
              <option value="Assiut">Assiut</option>
              <option value="Sohag">Sohag</option>
              <option value="Qena">Qena</option>
              <option value="Luxor">Luxor</option>
              <option value="Aswan">Aswan</option>
              <option value="Hurghada">Hurghada</option>
              <option value="Sharm El Sheikh">Sharm El Sheikh</option>
              <option value="Fayoum">Fayoum</option>
              <option value="Beni Suef">Beni Suef</option>
              <option value="6th of October City">6th of October City</option>
              <option value="New Cairo">New Cairo</option>
              <option value="Other">Other</option>
            </select>
            <input type="text" id="profEditCityOther" maxlength="60" hidden>
          </div>
        </div>
        <p class="field-msg" id="profEditMsg" role="alert"></p>
        <div class="prof-modal-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="profEditCancel" data-i18n="prof.cancel">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm" id="profEditSave" data-i18n="prof.save">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Crop photo modal -->
  <div class="c-modal" id="cropModal" hidden>
    <div class="c-modal-mask" id="cropModalMask"></div>
    <div class="c-modal-card crop-modal" role="dialog" aria-modal="true" aria-labelledby="cropTitle">
      <div class="c-modal-t" id="cropTitle" data-i18n="prof.crop.t">Crop photo</div>
      <p class="crop-hint" data-i18n="prof.crop.s">Drag to reposition. Use the corner handle to resize the square.</p>
      <div class="crop-stage" id="cropStage">
        <img id="cropImg" alt="">
        <div class="crop-frame" id="cropFrame"><span class="crop-handle"></span></div>
      </div>
      <div class="c-modal-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="cropCancel" data-i18n="prof.cancel">Cancel</button>
        <button type="button" class="btn btn-primary btn-sm" id="cropSave" data-i18n="prof.crop.save">Crop &amp; save</button>
      </div>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
